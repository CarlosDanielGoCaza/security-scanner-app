<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="../css/stylesregistrarusuario.css">
</head>
<body>

    <div class="backgroundwhite">
        <img src="../assets/backgroundwhite.png" alt="Decoración superior">
    </div>

    <div class="container">
        <div class="registro">
            <h1>Registro de nuevo usuario</h1>
            <form class="formulario" method="POST" action="#"> <!-- Puedes cambiar '#' por tu backend -->
                
                <div class="campo">
                    <label for="nombre"><strong>Nombre:</strong></label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="apellidoP"><strong>Apellido paterno:</strong></label>
                    <input type="text" id="apellidoP" name="apellidoP" required>
                </div>

                <div class="campo">
                    <label for="apellidoM"><strong>Apellido materno:</strong></label>
                    <input type="text" id="apellidoM" name="apellidoM" required>
                </div>

                <div class="campo">
                    <label for="fechaNacimiento"><strong>Fecha de nacimiento:</strong></label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                </div>

                <div class="campo">
                    <label for="correo"><strong>Correo electrónico:</strong></label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="campo">
                    <label for="matricula"><strong>Matrícula / Número de trabajador:</strong></label>
                    <input type="text" id="matricula" name="matricula" required>
                </div>

                <div class="campo">
                    <label for="turno"><strong>Turno:</strong></label>
                    <select id="turno" name="turno" required>
                        <option value="">Selecciona tu turno</option>
                        <option value="Matutino">Matutino</option>
                        <option value="Vespertino">Vespertino</option>
                        <option value="Mixto">Mixto</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="carrera"><strong>Carrera:</strong></label>
                    <select id="turno" name="turno" required>
                      <option value="">Selecciona tu carrera</option>
                      <option value="Computacion">Computacion</option>
                      <option value="Quimica">Quimica</option>
                      <option value="Matematicas">Matematicas</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="telefono"><strong>Número de teléfono:</strong></label>
                    <input type="tel" id="telefono" name="telefono" required pattern="[0-9+\s-]{10,15}">
                </div>

                <div class="campo">
                    <label for="rol"><strong>Rol en la facultad:</strong></label>
                    <select id="rol" name="rol" required>
                        <option value="">Selecciona un rol</option>
                        <option value="Alumno">Alumno</option>
                        <option value="Docente">Docente</option>
                        <option value="Administrativo">Administrativo</option>
                        <option value="Visitante">Visitante</option>
                    </select>
                </div>
            </form>
            <div class="botones">
              <button type="button" class="btn-rojo">Regresar</button>
              <button type="submit" class="btn-verde">Registrarme</button>
          </div>
        </div>
    </div>

    <div class="backgroundwhite-bottom">
        <img src="../assets/backgroundwhite-bottom.png" alt="Decoración inferior">
    </div>

</body>
</html>
